<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="navbar">
    <h1>🏥 Clinic Management System</h1>
    <nav>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/doctors}">Doctors</a>
        <a th:href="@{/appointments}">Appointments</a>
    </nav>
</header>

<main class="content">
    <div class="content-header">
        <h2>Doctors</h2>
        <a class="btn" th:href="@{/doctors/new}">+ Add Doctor</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Specialization</th>
            <th>Phone</th>
            <th>Available Hours</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="doctor : ${doctors}">
            <td th:text="${doctor.name}"></td>
            <td th:text="${doctor.specialization}"></td>
            <td th:text="${doctor.phone}"></td>
            <td th:text="${doctor.availableHours}"></td>
            <td>
                <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}">Edit</a> |
                <a th:href="@{/doctors/delete/{id}(id=${doctor.id})}"
                   onclick="return confirm('Delete this doctor?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
